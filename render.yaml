services:
  - type: web
    name: synapse-guard-app
    runtime: node
    plan: free
    region: singapore
    buildCommand: "npm install && curl -fsSL https://raw.githubusercontent.com/prometheus-lua/Prometheus/master/install.sh -o /tmp/install-prometheus.sh && sh /tmp/install-prometheus.sh && $HOME/.local/bin/prometheus-lua --version"
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: synapse-guard-db
          property: connectionString

databases:
  - name: synapse-guard-db
    plan: free
    region: singapore
